[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban_graph_engine"
version = "0.2.0"
description = "UrbanGraph Engine: Intelligence-Driven Logistics Integrity"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [ {name = "Luis Sandoval", email = "luis@example.com"} ]
keywords = ["logistics", "routing", "urban", "safety", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "streamlit",
    "osmnx",
    "geopandas",
    "requests",
    "pandas",
    "plotly",
    "psycopg2-binary",
    "python-dotenv",
    "httpx",
    "pyogrio",
    "rtree",
    "fiona",
    "shapely",
    "pyproj",
    "fastapi",
    "uvicorn",
    "pydantic",
    "networkx",
    "scipy",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/yourusername/urban_graph_engine"
Repository = "https://github.com/yourusername/urban_graph_engine"
Issues = "https://github.com/yourusername/urban_graph_engine/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "pre-commit",
    "pytest-cov",
]

# Optional: console entry point
[project.scripts]
urban-graph = "urban_graph_engine.cli:main"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
