name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest black isort flake8
    - name: Lint with flake8
      run: |
        flake8 urban_graph_engine/src/urban_graph_engine --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 urban_graph_engine/src/urban_graph_engine --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    - name: Format check with black
      run: black --check urban_graph_engine/src/urban_graph_engine tests/
    - name: Sort imports with isort
      run: isort --check-only --profile black urban_graph_engine/src/urban_graph_engine tests/
    - name: Test with pytest
      run: |
        pytest urban_graph_engine/tests/ --cov=urban_graph_engine --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false